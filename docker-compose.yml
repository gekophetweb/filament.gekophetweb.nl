# Project name: containers, networks and volumes are prefixed "filament-" / "filament_".
name: filament

services:
  app:
    build: { context: ., target: app }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - app_storage:/app/storage
    networks: [frontend, backend]
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; remove once the tunnel is in use
    restart: unless-stopped

  queue:
    build: { context: ., target: app }
    command: php artisan queue:work --tries=3 --max-time=3600
    healthcheck: { disable: true }   # image check probes the web port
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - app_storage:/app/storage
    networks: [backend]
    restart: unless-stopped

  scheduler:
    build: { context: ., target: app }
    command: php artisan schedule:work
    healthcheck: { disable: true }
    env_file: .env
    depends_on: [db, redis]
    networks: [backend]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      retries: 5
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
    networks: [backend]
    restart: unless-stopped

  # Start with: docker compose --profile tunnel up -d
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.1.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true

volumes:
  db_data:
  app_storage:
